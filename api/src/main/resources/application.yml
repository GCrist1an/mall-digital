# =============================================================================
# De Aquí API - configuración base (MD-15)
# Nada sensible va aquí: URL, usuarios y contraseñas llegan por variables de entorno.
#
# Dos usuarios de base de datos (ver db/README.md):
#   DEAQUI      dueño de las tablas. SOLO lo usa Flyway para migrar.
#   DEAQUI_APP  usuario de la API: SELECT/INSERT/UPDATE/DELETE, sin permisos de DDL.
#
# Variables de entorno
#   DB_URL            jdbc:oracle:thin:@deaquidev_tp?TNS_ADMIN=C:/ruta/al/wallet
#                     (alias del tnsnames.ora del wallet; en dev es deaquidev_tp)
#   DB_USER           DEAQUI_APP
#   DB_PASSWORD       contraseña de DEAQUI_APP
#   DB_SCHEMA         esquema dueño de las tablas (por defecto DEAQUI)
#   FLYWAY_ENABLED    true solo cuando se quiera migrar al arrancar (por defecto false)
#   FLYWAY_USER       DEAQUI (solo si FLYWAY_ENABLED=true)
#   FLYWAY_PASSWORD   contraseña de DEAQUI (solo si FLYWAY_ENABLED=true)
#   SPRING_PROFILES_ACTIVE   dev | prod
# =============================================================================
spring:
  application:
    name: de-aqui-api

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      # Always Free admite máx. 30 sesiones simultáneas (docs de Oracle): pool pequeño.
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 20000
      connection-init-sql: "ALTER SESSION SET TIME_ZONE = 'America/Bogota'"

  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    # Flyway usa al dueño del esquema (no al usuario de la API).
    url: ${DB_URL}
    user: ${FLYWAY_USER:}
    password: ${FLYWAY_PASSWORD:}
    # Solo db/migration. api/db-rollback/ y db/setup quedan fuera a propósito.
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: false
    out-of-order: false

  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo gestionan las migraciones SQL (db/migration), nunca Hibernate.
      ddl-auto: none
    properties:
      hibernate:
        # DEAQUI_APP no es dueño de las tablas: se califican con el esquema dueño.
        default_schema: ${DB_SCHEMA:DEAQUI}
        jdbc:
          time_zone: America/Bogota

  jackson:
    time-zone: America/Bogota

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

server:
  port: ${PORT:8080}
